name: Scrapling Probe (throwaway)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner egress IP
        run: curl -s https://ipinfo.io/json || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scrapling + browser
        run: |
          python -m pip install --upgrade pip
          pip install "scrapling[fetchers]"
          patchright install --with-deps chromium

      - name: Probe (plain control + StealthySession)
        shell: python {0}
        run: |
          import json, urllib.request, urllib.error, gzip
          from datetime import datetime, timedelta, timezone

          ist = timezone(timedelta(hours=5, minutes=30))
          D = (datetime.now(ist) + timedelta(days=1)).strftime("%Y-%m-%d")
          CID = "1102311"
          URL = ("https://www.district.in/gw/consumer/movies/v3/cinema"
                 "?meta=1&reqData=1&version=3&site_id=1&channel=mweb"
                 "&child_site_id=1&platform=district&cinemaId=%s&date=%s" % (CID, D))
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36")

          print("=== CONTROL: plain urllib (Azure IP) ===")
          req = urllib.request.Request(URL, headers={"x-guest-token": "x", "user-agent": UA})
          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  raw = r.read()
                  if r.headers.get("Content-Encoding") == "gzip": raw = gzip.decompress(raw)
                  b = raw.decode("utf-8","replace")
                  print("plain ->", r.status, "DENIED" if "Access Denied" in b else "OK", "len", len(b))
          except urllib.error.HTTPError as e:
              print("plain ->", e.code, "(blocked)")

          print("\n=== StealthySession (Azure IP) ===")
          from scrapling.fetchers import StealthySession
          with StealthySession(headless=True, extra_headers={"x-guest-token": "x"}, timeout=60000) as sess:
              page = sess.fetch(URL)
              status = getattr(page, "status", "?")
              body = page.body
              if isinstance(body, bytes): body = body.decode("utf-8","replace")
              denied = "Access Denied" in body
              print("stealth ->", status, "DENIED" if denied else "OK", "len", len(body))
              i, j = body.find("{"), body.rfind("}")
              if not denied and i != -1:
                  try:
                      d = json.loads(body[i:j+1])
                      print("  sessionDates:", d.get("data", {}).get("sessionDates"))
                      print("  n_sessions:", len(d.get("pageData", {}).get("sessions") or []))
                  except Exception as ex:
                      print("  json parse:", ex, "| head:", body[i:i+100])
              else:
                  print("  body head:", body[:100])
